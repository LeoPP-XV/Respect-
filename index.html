<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commentarii de Vita 🌿</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f3ea;--card:#fffdf7;--tx:#2b3a2c;--mu:#7a8576;--ln:#e4dfce;--g:#4c8a4f;--ac:#4c8a4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b16;--card:#1f261f;--tx:#e6ece3;--mu:#93a08f;--ln:#2e382d;--g:#6fb072;--ac:#6fb072}}
:root[data-theme="dark"]{--bg:#161b16;--card:#1f261f;--tx:#e6ece3;--mu:#93a08f;--ln:#2e382d;--g:#6fb072;--ac:#6fb072}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.badge,.pill{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.pill{padding:3px 14px;font-size:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.chk{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin:0 0 7px;border:1px solid var(--ln);border-radius:12px;background:transparent;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ln);display:grid;place-items:center;flex:none;color:#fff}
.chk.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.chk.on .box{background:var(--ac);border-color:var(--ac)}
.chk .mu{font-size:13px}
.subs{margin:-2px 0 8px 22px}.chk.sub{padding:9px 12px}
.grp{font-size:13px;color:var(--mu);margin:12px 0 6px}
.bar{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
textarea{width:100%;min-height:70px;border:1px solid var(--ln);border-radius:12px;background:transparent;color:var(--tx);font:inherit;padding:10px;resize:none;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{font:inherit;background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:4px 14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mu)}
.day{min-height:64px;border:1px solid var(--ln);border-radius:10px;padding:3px;background:color-mix(in srgb,var(--hc,var(--g)) calc(var(--a,0)*60%),transparent);color:var(--tx);font:inherit;font-size:11px;line-height:1.25;text-align:left;cursor:pointer;overflow:hidden;position:relative}
.day b{font-size:13px;display:block}
.day.today{outline:2px solid var(--ac)}
.day.sel{box-shadow:inset 0 0 0 2px var(--ac)}
.day .sn{display:block;color:var(--mu);overflow:hidden;max-height:2.5em}
.day .sn.hi{color:var(--tx);font-weight:600}
.day i{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.day .ct{position:absolute;right:4px;bottom:2px;font-size:10px;color:var(--mu)}
.rk{font-size:12px;margin-left:6px;border-radius:6px;padding:0 6px}
.rk.f{background:var(--tx);color:var(--bg)}.rk.s{border:1px solid var(--tx)}.rk.m{color:var(--mu);padding:0}
.pro{display:block;margin-top:8px;font:inherit;font-size:15px;color:var(--ac);background:none;border:1px dashed var(--ac);border-radius:10px;padding:10px 18px;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;font:inherit;background:none;border:0;color:var(--mu);padding:10px 6px;font-size:15px;border-radius:10px;cursor:pointer}
.tab.on{color:var(--ac);font-weight:700}
.tab span{display:flex;align-items:center;justify-content:center;height:34px;font-size:28px;line-height:1.2}
section{display:none}section.on{display:block}
:root[data-pal="blue"]{--bg:#eef3fa;--card:#fbfdff;--tx:#1f2d44;--mu:#6b7a93;--ln:#d7e0ee;--g:#3f7fc4;--ac:#3f7fc4}
:root[data-pal="black"]{--bg:#0b0b0c;--card:#171718;--tx:#ececec;--mu:#9a9a9e;--ln:#2b2b2e;--g:#c9ced6;--ac:#e2e6ec}
:root[data-pal="gray"]{--bg:#e9eaeb;--card:#f6f6f6;--tx:#2a2d30;--mu:#737980;--ln:#d6d8da;--g:#6b7580;--ac:#4f5965}
:root[data-pal="white"]{--bg:#fff;--card:#fff;--tx:#202124;--mu:#80868b;--ln:#e8eaed;--g:#5f8f6a;--ac:#3c6e47}
:root[data-pal="orange"]{--bg:#fbf3e6;--card:#fffaf0;--tx:#3a2a14;--mu:#8c7a60;--ln:#ecdcc0;--g:#e08a1e;--ac:#d9780f}
.ttl{text-align:center;padding:6px 0 14px}
.ttl h1{font:700 28px/1.15 Georgia,"Times New Roman","Noto Serif TC",serif;margin:0;letter-spacing:.5px}
.ttl h2{font-size:19px;margin:4px 0 2px;font-weight:600}
.ttl .sub{font:italic 13px Georgia,"Noto Serif TC",serif;color:var(--mu)}
select,input[type=text],input[type=password]{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;max-width:100%}
.fr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fr label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.item{padding:10px 0;border-top:1px solid var(--ln);font-size:15px}
.x{background:none;border:0;color:var(--mu);font-size:16px;cursor:pointer}
.pal{font:inherit;font-size:15px;margin:0 6px 8px 0;padding:10px 16px;border:1px solid var(--ln);border-radius:99px;background:transparent;color:var(--tx);cursor:pointer}
.pal.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent)}
@media (orientation:landscape) and (max-height:520px),(min-width:900px){
  body{padding-bottom:0}
  main{max-width:none;padding:12px calc(112px + env(safe-area-inset-right,0px)) 12px calc(14px + env(safe-area-inset-left,0px))}
  nav.tabs{top:0;left:auto;width:calc(98px + env(safe-area-inset-right,0px));flex-direction:column;justify-content:center;border-top:0;border-left:1px solid var(--ln);padding:6px calc(6px + env(safe-area-inset-right,0px)) 6px 6px}
}



.seg{display:flex;gap:6px;margin:0 0 12px}.seg button{flex:1;font:inherit;font-size:15px;padding:8px 4px;border:1px solid var(--ln);border-radius:99px;background:transparent;color:var(--tx);cursor:pointer}
.seg button.on,.col3 button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent);font-weight:700}
.col3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.col3 button{font:inherit;padding:10px 4px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer}.col3 button span{display:block;font-size:24px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600;border-top:0}tr.cur td{background:color-mix(in srgb,var(--ac) 14%,transparent)}
input[type=number],input[type=time],input[type=date],input[type=url]{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;max-width:100%}
input[type=color]{width:40px;height:34px;padding:0;border:1px solid var(--ln);border-radius:8px;background:none}
.evd{position:absolute;left:3px;bottom:3px;display:flex;gap:2px}.evd em{width:6px;height:6px;border-radius:50%;display:block}
.chipc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.th{display:block;max-width:140px;border-radius:10px;margin-top:6px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}details ul,details ol{margin:4px 0;padding-left:20px;font-size:14px}
a.lk{display:block;padding:12px;border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;color:var(--ac);text-decoration:none;font-weight:600}
.ttl+.seg{margin-top:0}
.col3{grid-template-columns:repeat(4,1fr)}.col3 button{font-size:13px}
</style>
</head>
<body>
<main>
<section id="s_lit">
  <div class="ttl"><h1>Liturgia Horarum</h1><h2>時程禮儀</h2><div class="sub">Opus Dei — 天主的工程</div></div>
  <div class="card" id="head"></div>
  <div class="card"><div class="row sp"><h2 style="margin:0">今日打卡 🌿</h2><span class="mu" id="streak"></span></div>
    <div class="bar"><i id="pbar"></i></div><div class="mu" id="ptxt" style="margin-top:4px"></div><div id="todayList" style="margin-top:8px"></div></div>
  <div class="card"><h2>📈 近四週</h2><div id="heat" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div><div class="mu" style="margin-top:6px">顏色越深，當天完成越多</div></div>
  <div class="card" id="badges"></div>
</section>
<section id="s_hea"></section>
<section id="s_home" class="on">
  <div class="ttl"><h1>Commentarii de Vita</h1><h2>生活紀錄</h2><div class="sub" id="pro"></div></div>
  <div class="card"><div class="row sp"><div class="nav" style="margin:0;gap:6px"><button data-a="cm" data-m="-1">‹</button><span><select id="cy"></select> <select id="cm"></select></span><button data-a="cm" data-m="1">›</button></div>
    <select id="flt" data-ch="flt"></select></div>
  <div class="grid" id="calG" style="margin-top:10px"></div><div class="mu" id="legend" style="margin-top:8px"></div></div>
  <div class="card" id="calD"></div>
  <div class="card" id="wk"></div>
</section>
<section id="s_life"></section>
<section id="s_set"><div id="setMine"></div><div id="setLit"></div></section>
</main>
<nav class="tabs"><button class="tab" data-a="tab" data-s="s_lit"><span><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M6.5 8.5h11"/></svg></span>日課</button><button class="tab" data-a="tab" data-s="s_hea"><span><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-45 12 12)"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><path d="M12 8.5v7"/></g></svg></span>健康</button><button class="tab on" data-a="tab" data-s="s_home"><span>🌿</span>首頁</button><button class="tab" data-a="tab" data-s="s_life"><span><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-5 9 5M5 10v9h14v-9M9 19v-5h6v5M12 5V3"/></svg></span>生活</button><button class="tab" data-a="tab" data-s="s_set"><span><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>設定</button></nav>
<script>
const DAY_MS=1000*60*60*24;
const SEASON_GREEN="#3FA34D",SEASON_WHITE="#F5F5F0",SEASON_PURPLE="#8B5FBF",SEASON_ROSE="#E8A0B4";
const COLOR_GOLD="#D4AF37",COLOR_CREAM="#F1E5AC",COLOR_LIGHT="#F9F6E5",COLOR_MAROON="#C41E3A",COLOR_BLUE="#4682B4",COLOR_SAINT_DEFAULT="#f0d78c";
const CYCLE_COLORS={"甲":"#5C7FE0","乙":"#2BA7A0","丙":"#E5894F"};
function addDays(date,days){const d=new Date(date);d.setDate(d.getDate()+days);return d}
function stripTime(date){return new Date(date.getFullYear(),date.getMonth(),date.getDate())}
function nextOrSameSunday(date){const d=stripTime(date);return addDays(d,(7-d.getDay())%7)}
function prevOrSameSunday(date){const d=stripTime(date);return addDays(d,-d.getDay())}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function calcEaster(year){const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return new Date(year,month-1,day)}
function liturgicalDatesForYear(Y){
  const easter=stripTime(calcEaster(Y)),christmas=new Date(Y,11,25);
  let epiphany=null;
  for(let day=2;day<=8;day++){const c=new Date(Y,0,day);if(c.getDay()===0){epiphany=c;break}}
  const baptismOfLord=epiphany.getDate()>=7?addDays(epiphany,1):addDays(epiphany,7);
  let holyFamily=null;
  if(christmas.getDay()!==0){for(let day=26;day<=31;day++){const c=new Date(Y,11,day);if(c.getDay()===0){holyFamily=c;break}}}
  if(!holyFamily)holyFamily=new Date(Y,11,30);
  const advent1=nextOrSameSunday(new Date(Y,10,27));
  return{Y,easter,christmas,epiphany,baptismOfLord,holyFamily,
    ashWednesday:addDays(easter,-46),palmSunday:addDays(easter,-7),holyMonday:addDays(easter,-6),holyTuesday:addDays(easter,-5),holyWednesday:addDays(easter,-4),holyThursday:addDays(easter,-3),goodFriday:addDays(easter,-2),holySaturday:addDays(easter,-1),
    ascension:addDays(easter,42),pentecost:addDays(easter,49),trinitySunday:addDays(easter,56),corpusChristi:addDays(easter,63),sacredHeart:addDays(easter,68),immaculateHeart:addDays(easter,69),
    advent1,advent2:addDays(advent1,7),advent3:addDays(advent1,14),advent4:addDays(advent1,21),christKing:addDays(advent1,-7)}}
function cycleLetterForLiturgicalYear(y){return["甲","乙","丙"][(((y-2023)%3)+3)%3]}
const WEEKDAY_CH=["日","一","二","三","四","五","六"];
function buildSolemnityList(td,Y){
  return[
  [td.ashWednesday,"聖灰禮儀日",SEASON_PURPLE,false],[td.palmSunday,"聖枝主日",COLOR_MAROON,false],
  [td.holyMonday,"聖週一",SEASON_PURPLE,false],[td.holyTuesday,"聖週二",SEASON_PURPLE,false],[td.holyWednesday,"聖週三",SEASON_PURPLE,false],
  [td.holyThursday,"吾主耶穌建立聖體聖事 聖週四",COLOR_GOLD,false],[td.goodFriday,"吾主救主耶穌受難日",COLOR_MAROON,false],
  [addDays(td.easter,1),"復活八日第二日",COLOR_GOLD,false],[addDays(td.easter,2),"復活八日第三天",COLOR_GOLD,false],[addDays(td.easter,3),"復活八日第四天",COLOR_GOLD,false],
  [addDays(td.easter,4),"復活八日第五天",COLOR_GOLD,false],[addDays(td.easter,5),"復活八日第六天",COLOR_GOLD,false],[addDays(td.easter,6),"復活八日第七天",COLOR_GOLD,false],
  [td.easter,"復活節",COLOR_GOLD,false],[addDays(td.easter,7),"救主慈悲主日",COLOR_GOLD,false],[td.ascension,"耶穌升天節",COLOR_GOLD,false],
  [td.pentecost,"聖神降臨節",COLOR_MAROON,false],[td.trinitySunday,"至聖天主聖三節",COLOR_GOLD,false],[td.corpusChristi,"基督聖體聖血節",COLOR_GOLD,false],
  [td.sacredHeart,"耶穌聖心節",COLOR_GOLD,false],[td.immaculateHeart,"聖母無玷聖心紀念日",COLOR_BLUE,true],[td.christKing,"基督普世君王節",COLOR_GOLD,false],
  [td.advent1,"將臨期第1主日",SEASON_PURPLE,true],[td.advent2,"將臨期第2主日",SEASON_PURPLE,true],[td.advent3,"喜樂主日",SEASON_ROSE,true],[td.advent4,"將臨期第4主日",SEASON_PURPLE,true],
  [new Date(Y,11,17),"上智者日",SEASON_PURPLE,false],[new Date(Y,11,18),"上主天主日",SEASON_PURPLE,false],[new Date(Y,11,19),"耶瑟之根日",SEASON_PURPLE,false],
  [new Date(Y,11,20),"達味之鑰日",SEASON_PURPLE,false],[new Date(Y,11,21),"東方旭日日",SEASON_PURPLE,false],[new Date(Y,11,22),"萬民君王日",SEASON_PURPLE,false],[new Date(Y,11,23),"厄馬奴耳日",SEASON_PURPLE,false],
  [td.christmas,"聖誕節",COLOR_GOLD,false],[new Date(Y,11,26),"聖斯德望 首位殉道者",COLOR_MAROON,false],[new Date(Y,11,27),"聖若望 宗徒聖史",COLOR_GOLD,false],[new Date(Y,11,28),"諸聖嬰孩",COLOR_MAROON,false],
  [new Date(Y,11,29),"聖誕八日第五天",COLOR_GOLD,false],[new Date(Y,11,30),"聖誕八日第六天",COLOR_GOLD,false],[new Date(Y,11,31),"聖誕八日第七天",COLOR_GOLD,false],
  [new Date(Y,0,1),"天主之母聖瑪利亞節",COLOR_BLUE,false],[td.holyFamily,"聖家節",COLOR_GOLD,false],[td.epiphany,"主顯節",COLOR_GOLD,false],[td.baptismOfLord,"主受洗節",COLOR_GOLD,false]]}
function matchSolemnity(date,td,Y){
  const d=stripTime(date),hour=date.getHours();
  if(sameDate(d,td.holySaturday))return hour>=18?{text:"復活前夕",color:COLOR_GOLD,saintAllowed:false}:{text:"聖週六",color:SEASON_PURPLE,saintAllowed:false};
  if(sameDate(d,new Date(Y,11,24)))return hour>=18?{text:"主降生前夕",color:COLOR_GOLD,saintAllowed:false}:{text:"主降生前日",color:SEASON_PURPLE,saintAllowed:false};
  for(const[fd,text,color,saintAllowed]of buildSolemnityList(td,Y)){if(fd&&sameDate(d,fd))return{text,color,saintAllowed}}
  return null}
function computeGenericSeasonText(date,td,Y){
  const d=stripTime(date),weekday=WEEKDAY_CH[d.getDay()],isSunday=d.getDay()===0;
  if(d>=td.christmas){const n=Math.round((d-td.christmas)/DAY_MS)+1;return{text:`聖誕期 · ${isSunday?"主日":"第"+n+"天"}`,color:SEASON_WHITE,seasonKind:"christmas",isSunday}}
  const prevChristmas=new Date(Y-1,11,25);
  if(d<td.baptismOfLord&&d>=new Date(Y,0,1)){const n=Math.round((d-prevChristmas)/DAY_MS)+1;return{text:`聖誕期 · ${isSunday?"主日":"第"+n+"天"}`,color:SEASON_WHITE,seasonKind:"christmas",isSunday}}
  if(d>=td.ashWednesday&&d<td.easter){
    if(d<nextOrSameSunday(td.ashWednesday))return{text:`聖灰禮儀後 · 星期${weekday}`,color:SEASON_PURPLE,seasonKind:"lent",isSunday};
    const l1=nextOrSameSunday(td.ashWednesday),week=Math.floor((d-l1)/(7*DAY_MS))+1,rose=isSunday&&week===4;
    return{text:isSunday?`四旬期第${week}主日`:`四旬期第${week}週 · 星期${weekday}`,color:rose?SEASON_ROSE:SEASON_PURPLE,seasonKind:"lent",isSunday}}
  if(d>=td.easter&&d<=td.pentecost){const week=Math.floor((d-td.easter)/(7*DAY_MS))+1;return{text:isSunday?`復活期第${week}主日`:`復活期第${week}週 · 星期${weekday}`,color:SEASON_WHITE,seasonKind:"easter",isSunday}}
  if(d>=td.advent1&&d<td.christmas){const week=Math.floor((d-td.advent1)/(7*DAY_MS))+1,rose=isSunday&&week===3;return{text:isSunday?`將臨期第${week}主日`:`將臨期第${week}週 · 星期${weekday}`,color:rose?SEASON_ROSE:SEASON_PURPLE,seasonKind:"advent",isSunday}}
  if(d>td.baptismOfLord&&d<td.ashWednesday){const fs=nextOrSameSunday(addDays(td.baptismOfLord,1)),week=2+Math.floor((prevOrSameSunday(d)-fs)/(7*DAY_MS));return{text:isSunday?`常年期第${week}主日`:`常年期第${week}週 · 星期${weekday}`,color:SEASON_GREEN,seasonKind:"ordinary",isSunday}}
  if(d>td.pentecost&&d<td.advent1){const week=34-Math.floor((td.christKing-prevOrSameSunday(d))/(7*DAY_MS));return{text:isSunday?`常年期第${week}主日`:`常年期第${week}週 · 星期${weekday}`,color:SEASON_GREEN,seasonKind:"ordinary",isSunday}}
  return{text:`星期${weekday}`,color:SEASON_GREEN,seasonKind:"ordinary",isSunday}}

<details><summary>補習日（週一、四、五可能到 21:00）</summary><ul><li>能在白天完成的作業，盡量用下課空檔。</li><li>回家後先處理晚餐、盥洗與必要的隔日準備。</li><li>不為了做完所有非急迫作業而長期壓縮睡眠。</li><li>長期睡不著、日夜顛倒或白天嚴重疲倦，請告訴家長並就醫評估。</li></ul></details>
<details><summary>睡不好時怎麼辦</summary><ul><li>拖延睡覺：設睡前提醒，手機放床邊以外。</li><li>躺下睡不著：起身在昏暗環境做安靜的事，有睡意再回床。</li><li>整晚沒睡：不安排長距離步行，優先休息。</li><li>作息大幅變動：先固定起床時間，再逐步調整就寢時間。</li></ul></details></div>
<div class="card"><h2>🍽️ 飲食</h2><div class="mu">第一階段不計算嚴格熱量，先建立規律、營養足夠的吃法；也不自設每日熱量上限、不用快速減重產品。</div>
<details><summary>三餐</summary><ul><li><b>早餐</b>：吐司＋雞蛋、牛奶或無糖豆漿；趕車時準備好攜帶的。不跳餐。</li><li><b>午餐</b>：正常吃學校午餐，兼顧主食、蛋白質、蔬菜。</li><li><b>晚餐</b>：不因較晚就省略；補習延後可先吃一部分，返家再補足。</li></ul></details>
<details><summary>四個原則</summary><ul><li>飲料以白開水為主，逐步減少含糖飲料。</li><li>零食不必完全禁止，留意飢餓感與進食情境。</li><li>不跳餐、不挨餓，也不因某餐吃多就刻意補償。</li><li>食物多樣，支持成長、學習與活動後恢復。</li></ul></details></div>
<div class="card"><h2>🚶 週六 10 公里步行</h2><div class="mu">萬金 → 佳平 → 返家，約 10 公里，預留 2.5–3 小時。</div>
<details><summary>出發前／途中／返家後</summary><ul><li>前一晚睡足，不為早起而通宵；檢查天氣、鞋子、飲水、手機與返家安排。</li><li>以舒服、能正常交談的速度走；視天氣補水、適時休息。</li><li>返家後補水、正常吃飯、洗澡休息；腿痛或異常疲倦，下週就調整距離。</li><li>前晚幾乎沒睡、頭暈或不適就取消；胸痛、異常喘促請立即停止並求助。</li></ul></details>
<details><summary>每週活動配置</summary><table><tr><td>週一</td><td>通勤與下課走動</td></tr><tr><td>週二</td><td>通勤與下課走動，有餘力散步 10–20 分鐘</td></tr><tr><td>週三</td><td>日常活動與輕鬆散步</td></tr><tr><td>週四</td><td>通勤、日常活動為主，兼顧補習</td></tr><tr><td>週五</td><td>不為週六訓練而熬夜；適度活動、準備隔日用品</td></tr><tr><td>週六</td><td>約 10 公里戶外步行，依睡眠與身體調整</td></tr><tr><td>週日</td><td>恢復、輕鬆散步或休息</td></tr></table></details></div>

  const html=`<!doctype html><meta charset="utf-8"><title>健康紀錄報告</title><body style="font-family:sans-serif;max-width:720px;margin:20px auto;padding:0 12px"><h2>健康紀錄報告</h2><div>${esc(CFG.name||"")}　期間 ${ks[0]} ～ ${ks[ks.length-1]}</div><div style="color:#666;font-size:12px">本人自行記錄，僅供醫療人員參考。</div><h3>體重（kg）</h3>${fx(wChart(ks))}${tb(["日期","清晨","睡前"],wr.map(k=>[k,w[k].am||"–",w[k].pm||"–"]))}<h3>睡眠</h3>${tb(["日期","就寢","起床","時數"],sr.map(k=>[k,w[k].sl.b,w[k].sl.w,(sleepMin(k)/60).toFixed(1)]))}<h3>飲食</h3>${tb(["日期","餐別","時間","內容","備註"],fr.flatMap(k=>meals(k).map(x=>[k.slice(5),x.ty,x.tm||"",esc(x.f),esc(x.n||"")])))}<script>setTimeout(()=>print(),400)<\/script>`;
  const win=open("","_blank");if(!win){alert("請允許彈出視窗後再試一次");return}win.document.write(html);win.document.close()};

/* ---- 設定 ---- */
const COLS=[["","預設（依等級）"],["#C41E3A","🔴 殉道（紅）"],["#4682B4","🔵 聖母（藍）"],["#D4AF37","🟡 慶祝（金）"],["#F5F5F0","⚪ 白色"],["#3FA34D","🟢 綠色"],["#8B5FBF","🟣 紫色"],["#E8A0B4","🌸 玫瑰"]];
const PALS=[["green","🌿 綠色系"],["blue","🌊 藍色系"],["black","🖤 黑色系"],["gray","🩶 灰色系"],["white","🤍 白色系"],["orange","🧡 橘黃色系"]];
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const opt=(a,v)=>a.map(x=>{const[i,t]=Array.isArray(x)?x:[x,x];return`<option value="${i}"${String(i)===String(v)?" selected":""}>${t}</option>`}).join("");
const dsel=id=>`<select id="${id}_m">${opt(rng(1,12).map(n=>[n,n+" 月"]))}</select> <select id="${id}_d">${opt(rng(1,31).map(n=>[n,n+" 日"]))}</select><div class="mu" id="${id}_p"></div>`;
const dot=c=>okc(c)?` <span style="color:${c}">●</span>`:"";
function applyPal(){const r=document.documentElement;if(CU.pal==="green")delete r.dataset.pal;else r.dataset.pal=CU.pal}
function afterCU(){saveCU();for(const k in XF)delete XF[k];applyPal();renderSet();renderCal();renderHome()}
function renderSet(){
  const L=(o,f,t)=>Object.keys(o).sort().map(k=>`<div class="item row sp"><span>${k.replace("-","/")}　${f(k,o[k])}</span><button class="x" data-del="${t}:${k}">✕</button></div>`).join("")||`<div class="mu">（尚無）</div>`;
  const nm=k=>SAINTS[k]?SAINTS[k].text:"（無聖人）";
  $("#setLit").innerHTML=`<div class="card"><h2>✝️ 日課與外觀</h2><div class="mu" id="sm">設定只存在這個瀏覽器；要換裝置請用最下方的備份。</div></div>
<div class="card"><h2>⭐ 個人升格</h2>${dsel("a")}
<div class="fr"><label>等級<select id="ar">${opt(["紀念日","慶日","節日"])}</select></label><label>遇更高位階日（慶日／節日）<select id="am">${opt([["0","不移日（被取代）"],["1","移日（往後優先）"]])}</select></label><label>顏色<select id="ac">${opt(COLS)}</select></label></div>
<button class="pro" data-add="promos">確定</button>${L(CU.promos,(k,v)=>`${nm(k)} → <b>${esc(v.rank)}</b>${v.move?"・移日":""}${dot(v.color)}`,"promos")}</div>
<div class="card"><h2>⛪ 個人瞻禮（堂區主保等）</h2>${dsel("b")}
<div class="fr"><label>瞻禮名稱<input type="text" id="bn" placeholder="例：堂區主保 ○○"></label><label>等級<select id="br">${opt([["節日","節日"],["慶日","慶日"],["紀念日","紀念日"],["","自由紀念"]])}</select></label></div>
<div class="fr"><label>原當日聖人<select id="bo">${opt([["cover","覆蓋（不顯示）"],["move","移日（慶日／節日才有效）"]])}</select></label><label>本瞻禮遇更高位階日<select id="bm">${opt([["0","不移日"],["1","移日"]])}</select></label><label>顏色<select id="bc">${opt(COLS)}</select></label></div>
<button class="pro" data-add="feasts">確定</button>${L(CU.feasts,(k,v)=>`<b>${esc(v.name)}</b> ${esc(v.rank||"自由紀念")}・原聖人${v.orig==="move"?"移日":"覆蓋"}${v.move?"・本身可移日":""}${dot(v.color)}`,"feasts")}</div>
<div class="card"><h2>📝 幫聖人加註</h2>${dsel("c")}
<div class="fr"><label>加註文字<input type="text" id="cn" placeholder="例：○○主保"></label></div>
<button class="pro" data-add="adds">確定</button>${L(CU.adds,(k,v)=>`${nm(k)} ＋「${esc(v)}」`,"adds")}</div>
<div class="card"><h2>🎨 色系</h2>${PALS.map(([v,t])=>`<button class="pal${CU.pal===v?" on":""}" data-pal="${v}">${t}</button>`).join("")}<div class="mu">綠色系會跟隨手機的淺色／深色模式，其他色系固定。</div></div>
<div class="card"><h2>☁️ 跨裝置同步（GitHub）</h2><div class="mu" id="gs">${GH.id?`✅ 已連線${lastSync?"，上次同步 "+lastSync.toLocaleTimeString():""}`:"尚未連線"}</div>
${GH.id?`<div class="fr"><button class="pro" data-act="ghs">立即同步</button><button class="pro" data-act="ghx">中斷連線</button></div>`:`<div class="mu" style="margin-top:6px">只在你的 GitHub Pages 網址能用。GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token (classic)，<b>只勾選 gist</b>，建議設期限；產生後把 Token 貼到下面。每個裝置貼一次即可，資料會存在你帳號底下的私人 Gist。</div><input type="password" id="gt" placeholder="ghp_…" style="margin-top:8px;width:100%"><button class="pro" data-act="ghc">連線並同步</button>`}</div>
<div class="card"><h2>💾 備份</h2><div class="mu">手動備份：舊裝置按「匯出」把文字存起來，新裝置貼進來按「匯入」。</div>
<textarea id="bk" placeholder="匯出的內容會出現在這裡；匯入請貼在這裡" style="margin-top:8px"></textarea>
<div class="fr"><button class="pro" data-act="exp">匯出</button><button class="pro" data-act="imp">匯入</button></div></div>`;
  ["a","b","c"].forEach(id=>{const f=()=>{const k=`${p2($(`#${id}_m`).value)}-${p2($(`#${id}_d`).value)}`,s=SAINTS[k];$(`#${id}_p`).textContent=`${k.replace("-","/")}　`+(s?s.text+(s.rank?`（${s.rank}）`:"（自由紀念）"):"（這天沒有聖人）")};$(`#${id}_m`).onchange=$(`#${id}_d`).onchange=f;f()})}
$("#setLit").onclick=e=>{
  const t=e.target.closest("button");if(!t)return;
  const msg=x=>{$("#sm").textContent=x};
  if(t.dataset.del){const[ty,k]=t.dataset.del.split(":");delete CU[ty][k];return afterCU()}
  if(t.dataset.pal){CU.pal=t.dataset.pal;return afterCU()}
  if(t.dataset.add){
    const ty=t.dataset.add,id={promos:"a",feasts:"b",adds:"c"}[ty],mo=+$(`#${id}_m`).value,da=+$(`#${id}_d`).value;
    if(new Date(2024,mo-1,da).getMonth()!==mo-1)return msg("這個日期不存在");
    const k=`${p2(mo)}-${p2(da)}`;
    if(ty==="promos"){if(!SAINTS[k])return msg("這天沒有聖人可以升格，請改用「個人瞻禮」");CU.promos[k]={rank:$("#ar").value,move:$("#am").value==="1",color:$("#ac").value}}
    else if(ty==="feasts"){const n=$("#bn").value.trim();if(!n)return msg("請輸入瞻禮名稱");const og=SAINTS[k],rk=$("#br").value;if($("#bo").value==="move"&&og&&og.rank&&sRank({rank:rk||null},k)>sRank(og,k))return msg("原當日聖人（"+og.rank+"）位階高於這個瞻禮，無法移走它；請提高瞻禮等級，或改選「覆蓋」");CU.feasts[k]={name:n,rank:$("#br").value,orig:$("#bo").value,move:$("#bm").value==="1",color:$("#bc").value}}
    else{const n=$("#cn").value.trim();if(!n)return msg("請輸入加註文字");if(!SAINTS[k]&&!CU.feasts[k])return msg("這天沒有聖人可以加註");CU.adds[k]=n}
    return afterCU()}
  if(t.dataset.act==="exp"){const d=JSON.stringify({v:1,store,CU,promo,H,SC,CFG});$("#bk").value=d;try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:"application/json"}));a.download="rikka-backup.json";a.click()}catch(x){}msg("已匯出：可複製下方文字存起來")}
  if(t.dataset.act==="imp"){try{const o=JSON.parse($("#bk").value);if(o.store){store=o.store;save()}if(o.promo){promo=o.promo;savePromo()}if(o.CU)CU=Object.assign({promos:{},feasts:{},adds:{},pal:"green"},o.CU);if(o.H){H=o.H;sH(1)}if(o.SC){SC=o.SC;sS(1)}if(o.CFG){CFG=o.CFG;sC(1)}afterCU();renderAll();msg("已匯入")}catch(x){msg("格式不正確，匯入失敗")}}
  const gm=x=>{const el=$("#gs");if(el)el.textContent=x};
  if(t.dataset.act==="ghc"){const k=$("#gt").value.trim();if(!k)return gm("請先貼上 Token");gm("連線中…");ghConnect(k).then(()=>renderSet()).catch(x=>{GH.tok="";GH.id="";gm("連線失敗："+x.message)})}
  if(t.dataset.act==="ghs"){gm("同步中…");ghSync(true).then(()=>gm("✅ 已同步 "+lastSync.toLocaleTimeString())).catch(x=>gm("同步失敗："+x.message))}
  if(t.dataset.act==="ghx"){GH={tok:"",id:""};saveGH();renderSet()}
};
/* ---- GitHub Gist 跨裝置同步 ---- */
let GH={tok:"",id:""},lastSync=null,gt;
try{GH=Object.assign(GH,JSON.parse(localStorage.getItem("lh-gh")||"{}"))}catch(e){}
const saveGH=()=>{try{localStorage.setItem("lh-gh",JSON.stringify(GH))}catch(e){}};
const GFILE="rikka-data.json";
const ghf=(path,o={})=>fetch("https://api.github.com"+path,{...o,headers:{Authorization:"Bearer "+GH.tok,Accept:"application/vnd.github+json","Content-Type":"application/json"}}).then(r=>{if(!r.ok)throw new Error(r.status===401?"Token 無效或已過期":"GitHub 回應 "+r.status);return r.json()});
const payload=()=>JSON.stringify({v:1,t:Date.now(),store,CU,promo,H,SC,CFG});
function merge(o){
  let ch=false;
  for(const k in(o.store||{})){const a=store[k],b=o.store[k];if(!a||(b.t||0)>(a.t||0)){store[k]=b;ch=true}}
  if(o.CU&&(o.CU.t||0)>(CU.t||0)){CU=Object.assign({promos:{},feasts:{},adds:{},pal:"green"},o.CU);if(o.promo)promo=o.promo;ch=true}
  for(const k in(o.H&&o.H.d||{})){const a=H.d[k],b=o.H.d[k];if(!a||(b.t||0)>(a.t||0)){H.d[k]=b;ch=true}}
  for(const k in(o.SC&&o.SC.ev||{})){const a=SC.ev[k],b=o.SC.ev[k];if(!a||(b.t||0)>(a.t||0)){SC.ev[k]=b;ch=true}}
  if(o.SC&&(o.SC.t||0)>(SC.t||0)){SC.cats=o.SC.cats||SC.cats;SC.links=o.SC.links||[];SC.rec=o.SC.rec||[];SC.tt=o.SC.tt;SC.t=o.SC.t;ch=true}
  if(o.CFG&&(o.CFG.t||0)>(CFG.t||0)){CFG=o.CFG;ch=true}
  return ch}
async function ghSync(push){
  if(!GH.id)return;
  const g=await ghf("/gists/"+GH.id),f=g.files&&g.files[GFILE];
  let txt=f?f.content:"{}";if(f&&f.truncated)txt=await(await fetch(f.raw_url)).text();
  if(merge(JSON.parse(txt||"{}"))){save(1);saveCU(1);savePromo(1);sH(1);sS(1);sC(1);applyPal();for(const k in XF)delete XF[k];renderAll()}
  if(push)await ghf("/gists/"+GH.id,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:payload()}}})});
  lastSync=new Date()}
function ghDirty(){if(!GH.id)return;clearTimeout(gt);gt=setTimeout(()=>ghSync(true).catch(()=>{}),3000)}
async function ghConnect(tok){
  GH.tok=tok;
  const list=await ghf("/gists?per_page=100");
  let g=list.find(x=>x.files&&x.files[GFILE]);
  if(!g)g=await ghf("/gists",{method:"POST",body:JSON.stringify({description:"日課打卡資料（自動同步）",public:false,files:{[GFILE]:{content:payload()}}})});
  GH.id=g.id;saveGH();await ghSync(true)}
applyPal();renderSet();
if(GH.id)ghSync(false).catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&GH.id)ghSync(false).catch(()=>{})});
$("#cy").innerHTML=opt(rng(2000,2100).map(y=>[y,y+" 年"]));$("#cm").innerHTML=opt(rng(0,11).map(i=>[i,i+1+" 月"]));
$("#flt").innerHTML=opt(FLT);
$("#cy").onchange=$("#cm").onchange=()=>{cs.y=+$("#cy").value;cs.m=+$("#cm").value;renderCal()};
$("#pro").textContent="pro "+(CFG.name||"");
renderAll();
</script>
